<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Whether Weather</title>
  </head>
  <body>
    <h1>Whether2Weather</h1>
    <a href="results.html" class="button">Results</a>

    <p>
      latitude: <span id="latitude"></span>&deg;<br />
      longitude: <span id="longitude"></span>&deg;
  </p>
  <input id="mood" value="what are you feeling" />
  <button id="submit">submit</button>

  <canvas id="weatherCanvas" width="200" height="200"></canvas>
    <script>
let lat, lon;
      const button = document.getElementById("submit");
      const canvas = document.getElementById("weatherCanvas");
      const ctx = canvas.getContext("2d");

      // Draw initial canvas background
      function drawCanvasBackground() {
        ctx.fillStyle = "#e0f7fa";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "16px Arial";
        ctx.fillStyle = "#003f5c";
        ctx.fillText("Weather Visualization", 10, 30);
      }

      drawCanvasBackground();

      button.addEventListener("click", async () => {
        const mood = document.getElementById("mood").value;

        // Fetch weather data
        const weather = await fetchWeather(lat, lon);
        if (weather) {
          displayWeatherOnCanvas(weather, mood);
        } else {
          alert("Could not fetch weather data");
        }
      });

      if ("geolocation" in navigator) {
        console.log("geolocation available");
        navigator.geolocation.getCurrentPosition(async (position) => {
          lat = position.coords.latitude;
          lon = position.coords.longitude;
          document.getElementById("latitude").textContent = lat.toFixed(2);
          document.getElementById("longitude").textContent = lon.toFixed(2);
        });
      } else {
        console.log("geolocation not available");
      }

      async function fetchWeather(lat, lon) {
        try {
          const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
          const weatherData = await response.json();
          return weatherData.current_weather;
        } catch (error) {
          console.error("Error fetching weather data:", error);
          return null;
        }
      }

      function displayWeatherOnCanvas(weather, mood) {
        drawCanvasBackground();

        ctx.font = "14px Arial";
        ctx.fillStyle = "#000";
        ctx.fillText(`Mood: ${mood}`, 10, 60);
        ctx.fillText(`Temperature: ${weather.temperature}°C`, 10, 90);
        ctx.fillText(`Wind Speed: ${weather.windspeed} km/h`, 10, 120);
        ctx.fillText(`Wind Direction: ${weather.winddirection}°`, 10, 150);
      }
      function saveToDatabase(mood, lat, lon, temperature) {
        const entry = { mood, latitude: lat, longitude: lon, temperature, timestamp: new Date() };

        db.insert(entry, (err, newDoc) => {
          if (err) {
            console.error("Error saving to database:", err);
          } else {
            console.log("Data saved:", newDoc);
          }
        });
      }
    </script>
  </body>
</html>
